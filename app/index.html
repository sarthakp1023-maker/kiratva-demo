    if (line) line.q = Math.min(10, line.q + q); else cart.push({ p: p, s: s, q: Math.min(10, q) });

      section(t("Policies", "नीतियाँ")) + '<div class="card flush">' + link("truck", t("Shipping", "शिपिंग"), t("Free across India", "पूरे भारत में मुफ़्त"), "web", "https://kiratva.com/shipping-policy") +
      link("doc", t("Returns and refunds", "वापसी और रिफ़ंड"), "", "web", "https://kiratva.com/cancellation-and-refund-policy") + link("doc", t("Terms", "नियम"), "", "web", "https://kiratva.com/terms-and-conditions") +
      link("doc", t("Privacy", "निजता"), "", "web", "https://kiratva.com/privacy-policy") + "</div>" +
      '<div class="about">KIRATVA · ' + t("Almora, Uttarakhand", "अल्मोड़ा, उत्तराखंड") + "\n" + t("Demo app ", "डेमो ऐप ") + VERSION + t(" · no payment is taken", " · कोई भुगतान नहीं लिया जाता") + "\n\n" +
      t("These products are not intended to diagnose, treat, cure or prevent any disease. Read the label before use.", "ये उत्पाद किसी बीमारी के निदान, इलाज या रोकथाम के लिए नहीं हैं। इस्तेमाल से पहले लेबल पढ़ें।") + "</div></div>";
  }

  // ---------------------------------------------------------------- sample QR
  function drawQr() {
    var c = document.getElementById("qr");
    if (!c) return;
    var g = c.getContext("2d"), W = c.width, n = 25, pad = W * 0.06, cell = (W - 2 * pad) / n, seed = 20261126;
    function rnd() { seed = (seed + 0x6D2B79F5) | 0; var x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, W);
    g.fillStyle = "#15382B";
    var corners = [[0, 0], [0, n - 7], [n - 7, 0]];
    for (var r = 0; r < n; r++) for (var col = 0; col < n; col++) {
      var finder = false, zone = false;
      corners.forEach(function (k) {
        var a = r - k[0], b = col - k[1];
        if (a >= -1 && a <= 7 && b >= -1 && b <= 7) zone = true;
        if (a >= 0 && a < 7 && b >= 0 && b < 7 && (a === 0 || a === 6 || b === 0 || b === 6 || (a >= 2 && a <= 4 && b >= 2 && b <= 4))) finder = true;
      });
      var dot = rnd() > 0.52;
      if (finder || (!zone && dot)) g.fillRect(pad + col * cell, pad + r * cell, cell + 0.5, cell + 0.5);
    }
    var w = W * 0.36, h = W * 0.15, x = (W - w) / 2, y = (W - h) / 2;
    g.fillStyle = "#E2A22B"; g.fillRect(x, y, w, h);
    g.fillStyle = "#17261E"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "bold " + (h * 0.62) + "px -apple-system, sans-serif"; g.fillText("DEMO", W / 2, W / 2 + 2);
  }

  // ---------------------------------------------------------------- navigation
  function current() { return stack[stack.length - 1]; }
  function capture() {
    Array.prototype.forEach.call($content.querySelectorAll("input[data-f]"), function (el) { draft[el.getAttribute("data-f")] = el.value.trim(); });
  }
  function render(keep) {
    capture();
    var root = !stack.length, pg = current(), title = "KIRATVA  किरत्व", html;
    if (root) html = [home, productsTab, cartTab, ordersTab, accountTab][tab]();
    else if (pg.type === "product") { title = pname(P[pg.i]); html = productPage(pg); }
    else if (pg.type === "checkout") { title = t("Checkout", "चेकआउट"); html = checkoutPage(); }
    else { title = t("Order ", "ऑर्डर ") + pg.o.no; html = orderPage(pg); }
    var y = $content.scrollTop;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    $back.hidden = root; $nav.hidden = !root;
    $title.textContent = title;
    $lang.textContent = hindi ? "EN" : "हिंदी";
    document.documentElement.lang = hindi ? "hi" : "en";
    $content.innerHTML = html;
    $content.classList.remove("enter");
    if (keep) $content.scrollTop = y;
    else { $content.scrollTop = 0; void $content.offsetWidth; $content.classList.add("enter"); }
    drawQr();
    var labels = [t("Home", "होम"), t("Products", "उत्पाद"), t("Cart", "कार्ट"), t("Orders", "ऑर्डर"), t("Account", "खाता")];
    $nav.innerHTML = ["home", "leaf", "cart", "orders", "user"].map(function (ic, i) {
      var n = cartCount();
      return '<button data-act="tab" data-arg="' + i + '"' + (i === tab ? ' class="on" aria-current="page"' : "") + '><span class="ic">' + icon(ic) +
        (i === 2 && n ? '<span class="badge">' + n + "</span>" : "") + "</span>" + labels[i] + "</button>";
    }).join("");
    if (!$install.hidden) installHint();
  }
  function push(pg) { capture(); stack.push(pg); try { history.pushState({ d: stack.length }, ""); } catch (e) {} render(); }
  function goTab(i) {
    capture();
    var n = stack.length;
    stack = []; tab = i;
    if (n) { skipPop = true; try { history.go(-n); } catch (e) { skipPop = false; } }
    render();
  }
  window.addEventListener("popstate", function (e) {
    if (skipPop) { skipPop = false; return; }
    var d = (e.state && e.state.d) || 0;
    if (d < stack.length) { capture(); stack.length = d; render(); }
  });

  function bad(key, msg) {
    var el = $content.querySelector('input[data-f="' + key + '"]');
    toast(msg);
    if (el) { el.classList.add("bad"); el.scrollIntoView({ block: "center", behavior: "smooth" }); el.focus({ preventScroll: true }); }
  }

  var ACT = {
    back: function () { if (stack.length) history.back(); },
    lang: function () { hindi = !hindi; save("hindi", hindi); render(true); },
    setlang: function (a) { hindi = a === "hi"; save("hindi", hindi); render(true); },
    tab: function (a) { goTab(+a); },
    product: function (a) { push({ type: "product", i: +a, sel: P[+a].pick, qty: 1 }); },
    size: function (a) { current().sel = +a; render(true); },
    qty: function (a, el) { var pg = current(); pg.qty = Math.max(1, Math.min(10, pg.qty + (+el.getAttribute("data-d")))); render(true); },
    add: function () { var pg = current(); addToCart(pg.i, pg.sel, pg.qty); toast(t("Added to cart", "कार्ट में जोड़ा गया")); goTab(2); },
    cartqty: function (a, el) {
      var l = cart[+a]; if (!l) return;
      l.q = Math.min(10, l.q + (+el.getAttribute("data-d")));
      if (l.q <= 0) cart.splice(+a, 1);
      save("cart", cart); render(true);
    },
    checkout: function () { push({ type: "checkout" }); },
    paymethod: function (a) {
      payMethod = a;
      document.getElementById("paylist").innerHTML = payList();
      drawQr();
    },
    pay: function () {
      capture();
      if (!draft.name) return bad("name", t("Please enter your name.", "कृपया अपना नाम लिखें।"));
      if (!/^[6-9]\d{9}$/.test(draft.phone)) return bad("phone", t("Enter a 10-digit Indian mobile number.", "10 अंकों का भारतीय मोबाइल नंबर लिखें।"));
      if (!draft.addr) return bad("addr", t("Please enter your address.", "कृपया पता लिखें।"));
      if (!/^\d{6}$/.test(draft.pin)) return bad("pin", t("Enter a 6-digit PIN code.", "6 अंकों का पिन कोड लिखें।"));
      if (!draft.city) return bad("city", t("Please enter your city.", "कृपया शहर लिखें।"));
      if (!cart.length) return goTab(2);
      FIELDS.forEach(function (f) { profile[f] = draft[f]; });
      save("profile", profile);
      var o = { no: "KD-" + (100000 + Math.floor(Math.random() * 900000)), time: Date.now(), items: cart.map(function (l) { return { p: l.p, s: l.s, q: l.q }; }),
        total: cartTotal(), pay: payMethod, name: draft.name, phone: draft.phone, addr: draft.addr, pin: draft.pin, city: draft.city };
      orders.unshift(o); save("orders", orders);
      cart = []; save("cart", cart);
      tab = 3; stack = [{ type: "order", o: o, fresh: true }];
      try { history.replaceState({ d: 1 }, ""); } catch (e) {}
      $content.innerHTML = ""; render();
    },
    order: function (a) { if (orders[+a]) push({ type: "order", o: orders[+a], fresh: false }); },
    reorder: function () {
      (current().o.items || []).forEach(function (it) { if (P[it.p] && it.s < P[it.p].sizes.length) addToCart(it.p, it.s, it.q); });
      goTab(2);
    },
    saveprofile: function () {
      capture();
      FIELDS.forEach(function (f) { profile[f] = draft[f]; });
      save("profile", profile);
      toast(t("Saved on this phone", "इस फ़ोन में सेव हो गया"));
    },
    wa: function (a) {
      var pg = current();
      if (a === "ask") whatsapp(t("Namaste KIRATVA, I have a question about your products.", "नमस्ते KIRATVA, मुझे आपके उत्पादों के बारे में जानना है।"));
      else if (a === "help") whatsapp(t("Namaste KIRATVA, I need some help.", "नमस्ते KIRATVA, मुझे मदद चाहिए।"));
      else if (a === "cordyceps") whatsapp(t("Namaste KIRATVA, please tell me when Cordyceps is ready.", "नमस्ते KIRATVA, कॉर्डिसेप्स तैयार होने पर मुझे बताइए।"));
      else if (a === "product") whatsapp(t("Namaste KIRATVA, I'm interested in " + P[pg.i].en + ".", "नमस्ते KIRATVA, मुझे " + P[pg.i].hi + " में रुचि है।"));
      else if (a === "cart") whatsapp(t("Namaste KIRATVA, I'd like to order:", "नमस्ते KIRATVA, मुझे यह ऑर्डर करना है:") + "\n" + cartText() + "\n" + t("Total", "कुल") + ": " + rupee(cartTotal()));
      else if (a === "order") {
        var o = pg.o;
        whatsapp(t("Namaste KIRATVA, my order ", "नमस्ते KIRATVA, मेरा ऑर्डर ") + o.no + ":\n" + orderLines(o).map(function (l) { return "• " + l.name + " = " + l.price; }).join("\n") + "\n" +
          t("Total", "कुल") + ": " + rupee(o.total) + "\n" + t("Payment", "भुगतान") + ": " + payName(o.pay) + "\n" + t("Deliver to", "पता") + ": " + o.name + ", " + orderWhere(o) + "\n" + t("Mobile", "मोबाइल") + ": " + o.phone);
      }
    },
    go: function (a) { location.href = a; },
    web: function (a) { web(a); },
    update: function () {
      toast(t("Checking for updates…", "अपडेट जाँच रहे हैं…"));
      var reload = function () { location.reload(); };
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }).catch(function () {}).then(function () { setTimeout(reload, 600); });
      } else setTimeout(reload, 600);
    },
    hideinstall: function () { $install.hidden = true; save("install-hidden", true); }
  };
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var fn = ACT[el.getAttribute("data-act")];
    if (fn) fn(el.getAttribute("data-arg"), el);
  });
  $content.addEventListener("input", function (e) { if (e.target.classList) e.target.classList.remove("bad"); });

  // ---------------------------------------------------------------- add to home screen
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function installHint() {
    var how = ios
      ? t("Tap ", "Safari में ") + icon("share", 18) + t(" Share, then “Add to Home Screen”.", " Share दबाएं, फिर “Add to Home Screen” चुनें।")
      : t("Open your browser menu and choose “Add to Home screen”.", "ब्राउज़र मेनू खोलें और “Add to Home screen” चुनें।");
    $install.innerHTML = '<img src="icon-180.png" alt=""><p><b>' + t("Install the KIRATVA app", "KIRATVA ऐप इंस्टॉल करें") + "</b>" + how + '</p><button data-act="hideinstall" aria-label="Close">×</button>';
  }
  if (!standalone && !load("install-hidden", false)) { $install.hidden = false; }

  try { history.replaceState({ d: 0 }, ""); } catch (e) {}
  render();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
